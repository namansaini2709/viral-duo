<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }
  .wrapper { display: grid; }
  .main { grid-area: 1 / 1; background: lightblue; height: 150vh; position: relative; z-index: 2; margin-bottom: 50vh; }
  .footer { grid-area: 1 / 1; align-self: end; background: pink; height: 50vh; position: sticky; bottom: 0; z-index: 1; }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="main">Main Content (Scroll Down)</div>
    <div class="footer">Footer</div>
  </div>
</body>
</html>
